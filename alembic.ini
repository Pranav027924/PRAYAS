[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Intentionally empty. The URL comes from PRAYAS_DATABASE_URL_OWNER via env.py —
# secrets are injected from the environment, never read from files
# (Execution Playbook, Phase 0).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
