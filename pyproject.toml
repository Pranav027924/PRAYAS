[project]
name = "prayas"
version = "0.0.0"
description = "Liquidity-aware recovery and retention engine for recurring debits in India"
requires-python = ">=3.12,<3.13"

# Dependency set is deliberately minimal. Adding a dependency is a
# Class A decision; every entry here traces to an approved ADR or to the project's
# engineering standards. Structured logging and settings are stdlib on purpose.
dependencies = [
    "fastapi>=0.115",           # the project engineering standards
    "uvicorn[standard]>=0.32",  # ASGI server; FastAPI is not runnable without one
    "sqlalchemy[asyncio]>=2.0.36",  # ADR-003
    "asyncpg>=0.30",                # ADR-003
    "alembic>=1.14",                # ADR-011, project standard
    "pyyaml>=6.0",                  # ADR-026; rule pack format chosen in ADR-020
    "numpy>=2.1",                   # ADR-029; reproducible streams for the simulator
    "scikit-learn>=1.9.0",  # ADR-064; §21's V1 GBM hazard and isotonic calibration
]

[dependency-groups]
dev = [
    "pytest>=8.3",           # project standard
    "pytest-asyncio>=0.24",  # consequence of pytest + async stack
    "hypothesis>=6.112",     # ADR-016, §40.3 property-based tier
    "httpx>=0.28",           # required by fastapi.testclient; consequence of FastAPI
    "pytest-cov>=6.0",       # consequence of ADR-009 coverage floor
    "ruff>=0.8",             # project standard
    "mypy>=1.13",            # project standard
    "pip-audit>=2.7",        # ADR-009
    "mutmut>=3.0",           # ADR-023, §40.10 — scoped to prayas/gate/
    "types-PyYAML>=6.0",     # mypy --strict needs stubs for ADR-026
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prayas"]

# ─────────────────────────── ruff ───────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

# The specification set is authoritative reference material, not source code.
# ruff formats Python code blocks inside markdown, which silently rewrites the
# spec — never let it near docs/.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # flake8-datetimez — naive datetimes are a bug here (§17.4: UTC storage)
    "T20",       # no print()
    "SIM",       # simplify
    "PTH",       # pathlib
    "RUF",
]
ignore = [
    "E501",  # line length is enforced by the formatter
]

[tool.ruff.lint.per-file-ignores]
# Migrations are generated-shaped and full of long DDL strings.
"migrations/versions/*.py" = ["E501"]

# ─────────────────────────── mypy ───────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
plugins = []

[[tool.mypy.overrides]]
# Alembic's generated env/version modules are not worth strict-typing.
module = ["migrations.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# scikit-learn ships no py.typed marker (ADR-064). Untyped at the boundary
# only: every function in `prayas.models` that touches it still declares and
# returns concrete types, so the Any stops at the import.
module = ["sklearn.*"]
ignore_missing_imports = true

# ─────────────────────────── pytest ───────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config"
markers = [
    "db: requires a live PostgreSQL instance",
    "slow: long-running; the 10,000-cycle generation budget (§38)",
]

# ─────────────────────────── coverage ───────────────────────────
[tool.coverage.run]
source = ["prayas"]
branch = true
omit = ["prayas/__main__.py"]

[tool.coverage.report]
fail_under = 85          # ADR-009. A ratchet to raise, not a bar to fight.
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ─────────────────────────── mutmut (ADR-023) ───────────────────────────
# Scoped to the gate: §40.10's exit criterion is "mutation testing on gate
# predicates: no surviving mutants". Pointing it at the whole codebase would
# push runtime well past any usable budget.
[tool.mutmut]
# The whole package is copied so `mutants/` stays importable — the root
# conftest imports prayas.db, and copying only gate/ breaks collection.
# Scope is applied at run time instead: `mutmut run "prayas.gate.*"`.
source_paths = ["prayas/"]
pytest_add_cli_args_test_selection = ["tests/unit/"]
