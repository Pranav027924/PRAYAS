<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}PRAYAS{% endblock %}</title>
<link rel="stylesheet" href="/console/static/app.css?v={{ asset_v }}">
<style>
  /* The operator and replay screens predate the demo shell and use their own
     markup (`.bar`, `.panel`, bare `main`). Rather than rewrite those two
     templates, this maps their structure onto the same tokens `app.css`
     defines — one design system, two layouts. */
  header {
    background: var(--blue);
    background-image:
      linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 46px 46px;
  }
  .bar {
    max-width: 78rem; margin: 0 auto;
    padding: 18px 26px;
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    color: rgba(255,255,255,.80);
  }
  .bar a { color: rgba(255,255,255,.80); }
  .bar a:hover { color: #fff; }
  header .brand { font-weight: 800; font-size: 18px; letter-spacing: -.02em; color: #fff; }
  header .brand small {
    margin-left: 10px; font-size: 10px; font-weight: 600;
    letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.60);
  }
  main { max-width: 78rem; margin: 0 auto; padding: 28px 26px 60px; }

  main h2 {
    margin: 32px 0 10px;
    font-size: 11px; font-weight: 700;
    letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3);
  }
  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  td.wrap { white-space: normal; color: var(--ink-3); }
  .scroll { overflow-x: auto; }
  .no { color: var(--deny); font-weight: 700; }
  form.inline { margin: 0; }
  button {
    font: inherit; font-size: 13px; font-weight: 600;
    padding: 8px 15px; border-radius: var(--r-s); cursor: pointer;
    color: var(--ink); background: var(--surface); border: 1px solid var(--line);
    transition: border-color .15s, color .15s, background .15s;
  }
  button:hover { border-color: var(--indigo); color: var(--indigo); background: var(--indigo-wash); }
</style>
{% block head %}{% endblock %}
</head>
<body>
<header>
  <div class="bar">
    <span class="brand">PRAYAS <small>recovery engine</small></span>
    {% block nav %}{% endblock %}
  </div>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
