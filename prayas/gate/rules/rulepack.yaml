# PRAYAS compliance rule pack — transcribed from Master Spec §30.1.
#
# This file is the source of truth (ADR-020). An Alembic migration loads it into
# `compliance_rules`; the gate reads the table at runtime. A regulatory change is
# therefore a data migration a non-engineer can review as a YAML diff.
#
# Invariant 10: every rule carries a citation and an `as_of` date. A rule without
# them is an opinion, not a rule.
#
# Changing a rule means adding a NEW version, never editing an existing one —
# the ledger records which version governed each past decision, and rewriting a
# version retroactively falsifies that record.
#
# Every rule needs a unit test covering BOTH sides of its boundary before it is
# activated (compliance-gate rules).

rules:
  - rule_id: NPCI-AUTOPAY-WINDOW
    version: 3
    regulator: NPCI
    citation: "UPI Autopay non-peak execution windows"
    as_of: 2026-08-01
    applies_to: [debit_attempt]
    rails: [upi_autopay]
    predicate: "hour_ist < 10 or (hour_ist >= 13 and hour_ist < 17) or hour_ist >= 21.5"
    on_fail: DENY
    created_by: spec-30.1

  # Version 2 is retained deliberately. The loader upserts on
  # `(rule_id, version)`, so both rows exist and `load_active_rules` picks by
  # `as_of` — which is what lets a decision made before 2026-08-30 replay
  # against the version that actually governed it. Deleting this entry would
  # erase that history on every fresh database, which is the failure ADR-020's
  # "never edit a version in place" is written to prevent.
  - rule_id: RBI-EMANDATE-PDN-24H
    version: 2
    regulator: RBI
    citation: "Digital Payments – E-mandate Framework, 2026"
    as_of: 2026-04-21
    applies_to: [debit_attempt]
    rails: [upi_autopay, card_emandate, enach]
    predicate: "pdn_sent_at != null and hours_since(pdn_sent_at) >= 24"
    on_fail: DENY

  # Version 3 (FINDING-P14-01). Version 2 enumerated `[upi_autopay,
  # card_emandate, enach]` — every rail that existed, so it behaved identically
  # to `rails: null`. A rail added later would have inherited the universal
  # rules and silently escaped this one, and the resulting debit would have
  # looked lawful.
  #
  # `as_of` is the date this *encoding* takes effect, not a new regulation. The
  # RBI framework is unchanged and its citation is untouched. Dating it to the
  # correction rather than back-dating to 2026-04-21 keeps §30.1's replay
  # property intact: a decision made before then still selects version 2.
  - rule_id: RBI-EMANDATE-PDN-24H
    version: 3
    regulator: RBI
    citation: "Digital Payments – E-mandate Framework, 2026"
    as_of: 2026-08-30
    applies_to: [debit_attempt]
    rails: null
    predicate: "pdn_sent_at != null and hours_since(pdn_sent_at) >= 24"
    on_fail: DENY
    created_by: finding-p14-01
    created_by: spec-30.1

  - rule_id: NPCI-PDN-CUTOFF-2350
    version: 1
    regulator: NPCI
    citation: "NPCI operating guidelines — PDN submission cutoff"
    as_of: 2026-04-21
    applies_to: [notification]
    rails: null
    predicate: "not (is_next_day_debit and hour_ist >= 23.83)"
    on_fail: DENY
    created_by: spec-30.1

  - rule_id: RBI-EMANDATE-AFA-CAP
    version: 2
    regulator: RBI
    citation: "Digital Payments – E-mandate Framework, 2026"
    as_of: 2026-04-21
    applies_to: [debit_attempt]
    rails: null
    predicate: "amount_paise <= afa_free_cap(mcc)"
    on_fail: ESCALATE_HUMAN
    created_by: spec-30.1

  - rule_id: RBI-FPC-CONTACT-WINDOW
    version: 1
    regulator: RBI
    citation: "Fair Practices Code, circular 12 Aug 2022"
    as_of: 2022-08-12
    applies_to: [sms, whatsapp, voice]
    rails: null
    predicate: "hour_ist >= 8 and hour_ist < 19"
    on_fail: DEFER
    created_by: spec-30.1

  - rule_id: TRAI-DLT-TEMPLATE
    version: 4
    regulator: TRAI
    citation: "TCCCPR 2018, as amended 2025"
    as_of: 2025-01-01
    applies_to: [sms]
    rails: null
    predicate: "dlt_template_id != null and header_series == '160' and not dnd_registered"
    on_fail: DENY
    created_by: spec-30.1

  - rule_id: DPDP-CONSENT-VALID
    version: 1
    regulator: MeitY
    citation: "DPDP Act 2023"
    as_of: 2023-08-11
    applies_to: [sms, whatsapp, voice, debit_attempt]
    rails: null
    predicate: "consent_ref != null and not consent_withdrawn"
    on_fail: DENY
    created_by: spec-30.1

  # Internal policy, not law, and in the same store deliberately (§30.1):
  # "customer-protection limits deserve the same enforcement mechanism and the
  # same audit visibility as statutory ones."
  - rule_id: PRAYAS-FATIGUE-CAP
    version: 1
    regulator: INTERNAL
    citation: "Product policy — customer protection"
    as_of: 2026-01-01
    applies_to: [sms, whatsapp]
    rails: null
    predicate: "messages_30d < tenant_fatigue_cap"
    on_fail: DEFER
    created_by: spec-30.1

# AFA-free ceilings (ADR-021). Regulatory data, so it carries citation and
# as_of exactly as the predicates do. `mcc: "*"` is the default ceiling;
# specific MCCs override it.
#
# §40.2 fixes the boundaries these must be tested against:
#   ₹14,999 / ₹15,000 / ₹15,001   and   ₹99,999 / ₹1,00,000 for exempt MCCs
afa_caps:
  - mcc: "*"
    cap_paise: 1500000 # ₹15,000
    regulator: RBI
    citation: "Digital Payments – E-mandate Framework, 2026 — AFA-free ceiling"
    as_of: 2026-04-21

  # Exempt categories carry the raised ₹1,00,000 ceiling.
  - mcc: "6300" # Insurance premiums
    cap_paise: 10000000
    regulator: RBI
    citation: "Digital Payments – E-mandate Framework, 2026 — exempt categories"
    as_of: 2026-04-21

  - mcc: "6012" # Financial institutions — loan/EMI repayment
    cap_paise: 10000000
    regulator: RBI
    citation: "Digital Payments – E-mandate Framework, 2026 — exempt categories"
    as_of: 2026-04-21

  - mcc: "6211" # Securities — SIP contributions
    cap_paise: 10000000
    regulator: RBI
    citation: "Digital Payments – E-mandate Framework, 2026 — exempt categories"
    as_of: 2026-04-21
