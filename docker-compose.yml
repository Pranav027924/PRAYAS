# Phase 0 exit criterion: `docker compose up` produces a working stack from a
# clean clone. Ordering is postgres → migrate → api, each gated on the previous
# actually being ready, so `docker compose up --wait` is a genuine verification
# rather than a race.

services:
  postgres:
    image: postgres:16-alpine # ADR-002
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prayas}
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-prayas_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-prayas_local_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_OWNER_USER:-prayas_owner} -d ${POSTGRES_DB:-prayas}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Runs as the OWNER role. Migrations hold DDL rights; the app never does.
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      PRAYAS_ENV: ${PRAYAS_ENV:-local}
      PRAYAS_APP_DB_PASSWORD: ${POSTGRES_APP_PASSWORD:-prayas_local_dev_only}
      PRAYAS_DATABASE_URL_OWNER: postgresql+asyncpg://${POSTGRES_OWNER_USER:-prayas_owner}:${POSTGRES_OWNER_PASSWORD:-prayas_local_dev_only}@postgres:5432/${POSTGRES_DB:-prayas}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Runs as the APP role: owns nothing, subject to RLS unconditionally (ADR-004).
  api:
    build: .
    env_file:
      - .env
    environment:
      PRAYAS_ENV: ${PRAYAS_ENV:-local}
      PRAYAS_LOG_LEVEL: ${PRAYAS_LOG_LEVEL:-INFO}
      PRAYAS_DATABASE_URL_APP: postgresql+asyncpg://${POSTGRES_APP_USER:-prayas_app}:${POSTGRES_APP_PASSWORD:-prayas_local_dev_only}@postgres:5432/${POSTGRES_DB:-prayas}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)\"",
        ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  # §15 catalogues chain-verifier as its own component (ADR-022). Separate from
  # the API so a multi-minute chain walk never competes with request handling,
  # and so replicas of the API do not each redundantly verify the same chains.
  # §43: "Ledger chain breaks — Any — Page immediately."
  chain-verifier:
    build: .
    command:
      ["python", "-m", "prayas.ledger.verify", "--interval", "${VERIFY_INTERVAL:-300}"]
    environment:
      PRAYAS_ENV: ${PRAYAS_ENV:-local}
      PRAYAS_LOG_LEVEL: ${PRAYAS_LOG_LEVEL:-INFO}
      PRAYAS_DATABASE_URL_APP: postgresql+asyncpg://${POSTGRES_APP_USER:-prayas_app}:${POSTGRES_APP_PASSWORD:-prayas_local_dev_only}@postgres:5432/${POSTGRES_DB:-prayas}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # §17.2's middle step. Without this nothing drains `events_raw` and no
  # projected state ever exists, so the executor polls an empty queue forever
  # (FINDING-P17-04). Its own service for the same reason the executor is:
  # projection is a read-heavy fold over history and must not compete with the
  # fire path. Safe to replicate — `project_tenant` claims with SKIP LOCKED.
  projector:
    build: .
    command: ["python", "-m", "prayas.ingest.worker"]
    env_file:
      - .env
    environment:
      PRAYAS_ENV: ${PRAYAS_ENV:-local}
      PRAYAS_LOG_LEVEL: ${PRAYAS_LOG_LEVEL:-INFO}
      PRAYAS_DATABASE_URL_APP: postgresql+asyncpg://${POSTGRES_APP_USER:-prayas_app}:${POSTGRES_APP_PASSWORD:-prayas_local_dev_only}@postgres:5432/${POSTGRES_DB:-prayas}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # §17.2's `decision-svc`. Reads projected state, solves §23.2, and writes
  # `scheduled_actions` — the queue the executor drains. Separate from the
  # projector so a slow solve cannot stall ingestion, and from the executor
  # because scheduling is not firing (§32 re-validates at fire time regardless).
  planner:
    build: .
    command: ["python", "-m", "prayas.planner.worker"]
    env_file:
      - .env
    environment:
      PRAYAS_ENV: ${PRAYAS_ENV:-local}
      PRAYAS_LOG_LEVEL: ${PRAYAS_LOG_LEVEL:-INFO}
      PRAYAS_DATABASE_URL_APP: postgresql+asyncpg://${POSTGRES_APP_USER:-prayas_app}:${POSTGRES_APP_PASSWORD:-prayas_local_dev_only}@postgres:5432/${POSTGRES_DB:-prayas}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # The executor is its own service (ADR-042): it scales on pending-timer depth
  # per §15, and it must be killable independently of the API — two Phase 6
  # exit criteria turn on surviving a real process death.
  executor:
    build: .
    command: ["python", "-m", "prayas.executor.worker"]
    env_file:
      - .env
    environment:
      PRAYAS_ENV: ${PRAYAS_ENV:-local}
      PRAYAS_LOG_LEVEL: ${PRAYAS_LOG_LEVEL:-INFO}
      PRAYAS_DATABASE_URL_APP: postgresql+asyncpg://${POSTGRES_APP_USER:-prayas_app}:${POSTGRES_APP_PASSWORD:-prayas_local_dev_only}@postgres:5432/${POSTGRES_DB:-prayas}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
